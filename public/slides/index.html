<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/slides/" id="slides-base" />
    <script>
      (function () {
        if (location.protocol === "file:") {
          document.getElementById("slides-base").setAttribute("href", "./");
        }
      })();
    </script>
    <title>Fôlego do Mês · Case Agibank · Miguel Fernandes Costacurta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;

        --bg: #f8f9fc;
        --surface: #ffffff;
        --surface-2: #f0f2f7;
        --border: rgba(21, 26, 40, 0.09);
        --border-strong: rgba(21, 26, 40, 0.14);

        --text: #151a28;
        --muted: rgba(21, 26, 40, 0.62);
        --muted-2: rgba(21, 26, 40, 0.42);

        --accent: #0064fd;
        --accent-2: #3385ff;
        --accent-soft: rgba(0, 100, 253, 0.08);
        --accent-border: rgba(0, 100, 253, 0.24);

        --green: #2fc750;
        --green-bright: #44e100;
        --green-soft: rgba(47, 199, 80, 0.12);
        --blue: #0064fd;
        --blue-soft: rgba(0, 100, 253, 0.1);
        --yellow: #e8a020;
        --yellow-soft: rgba(232, 160, 32, 0.12);
        --red: #e04545;
        --red-soft: rgba(224, 69, 69, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 100, 253, 0.07), transparent),
          radial-gradient(1200px 600px at 50% -10%, rgba(255, 255, 255, 0.9), transparent 60%);
      }

      .deck { height: 100%; display: grid; grid-template-rows: 1fr; }

      main {
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      .slide {
        position: absolute;
        inset: 0;
        padding: clamp(24px, 3.5vw, 52px) clamp(28px, 5vw, 80px);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(12px, 1.2vw, 18px);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 320ms ease, transform 320ms ease;
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      /* ── Meta bar ── */
      .meta-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }

      .meta-left {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .brand-logo {
        height: 36px;
        width: auto;
        display: block;
        flex-shrink: 0;
      }

      .brand-tag {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted-2);
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        white-space: nowrap;
      }

      .pageno {
        display: inline-flex;
        gap: 12px;
        align-items: center;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 500;
      }

      .pageno .sep { opacity: 0.5; }

      .meta-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .back-app {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        transition: all 0.15s ease;
      }

      .back-app:hover {
        color: var(--accent);
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }

      .author {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      /* ── Body ── */
      .body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(18px, 1.8vw, 32px);
        min-height: 0;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }

      .eyebrow.accent { color: var(--accent); }

      h1.display {
        font-size: clamp(38px, 5.2vw, 76px);
        line-height: 1.02;
        letter-spacing: -0.028em;
        font-weight: 700;
        margin: 0;
        max-width: 22ch;
      }

      h1.display .hl { color: var(--accent); }

      h2.title {
        font-size: clamp(26px, 3.4vw, 48px);
        line-height: 1.06;
        letter-spacing: -0.025em;
        font-weight: 700;
        margin: 0;
        max-width: 28ch;
      }

      h2.title .hl { color: var(--accent); }

      p.lead {
        font-size: clamp(15px, 1.2vw, 18px);
        line-height: 1.55;
        max-width: 70ch;
        color: var(--muted);
        margin: 0;
      }

      .mono { font-family: "Geist Mono", ui-monospace, monospace; }

      /* ── Signature ── */
      .signature {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        padding: 9px 16px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      .signature .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 100, 253, 0.14);
      }

      .signature .name {
        color: var(--text);
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      /* ── Cover ── */
      .slide-cover {
        overflow: hidden;
      }

      .slide-cover::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 52% 46% at 72% 38%, rgba(0, 100, 253, 0.13), transparent 68%),
          radial-gradient(ellipse 40% 36% at 12% 68%, rgba(47, 199, 80, 0.07), transparent 62%);
        z-index: 0;
      }

      .slide-cover > * {
        position: relative;
        z-index: 1;
      }

      .cover {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: clamp(28px, 4vw, 56px);
        align-items: center;
      }

      .cover-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .cover-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        align-self: flex-start;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 18px;
        box-shadow: 0 2px 8px rgba(21, 26, 40, 0.04);
      }

      .cover-kicker .k-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(47, 199, 80, 0.18);
      }

      .cover-copy .display {
        font-size: clamp(56px, 7.2vw, 104px);
        line-height: 0.93;
        letter-spacing: -0.045em;
        max-width: none;
      }

      .cover-quote-bar {
        margin-top: 20px;
        padding: 4px 0 4px 16px;
        border-left: 3px solid var(--accent);
      }

      .cover-tagline {
        margin: 0;
        font-size: clamp(19px, 2vw, 27px);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
        line-height: 1.2;
      }

      .cover-tagline span {
        color: var(--accent);
      }

      .cover-lead {
        margin-top: 16px;
        max-width: 50ch;
        font-size: clamp(14px, 1.15vw, 16.5px);
      }

      .cover-author-dock {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .cover-author-card {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px 10px 10px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        box-shadow: inset 0 1px 0 #fff, 0 8px 20px -8px rgba(21, 26, 40, 0.08);
      }

      .cover-avatar {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #0046b8);
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -0.02em;
      }

      .cover-author-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .cover-author-meta .lbl {
        font-size: 9px;
        font-family: "Geist Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted-2);
        font-weight: 600;
      }

      .cover-author-meta .nm {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      /* Showcase visual da direita na Capa */
      .cover-showcase {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .showcase-window {
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid rgba(21, 26, 40, 0.11);
        box-shadow:
          inset 0 1px 0 #ffffff,
          0 24px 60px -18px rgba(0, 100, 253, 0.16),
          0 4px 16px -4px rgba(21, 26, 40, 0.06);
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .showcase-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .showcase-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(224, 69, 69, 0.1);
        color: var(--red);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .showcase-badge.recovered {
        background: var(--green-soft);
        color: #168030;
      }

      .showcase-kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .showcase-kpi {
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
      }

      .showcase-kpi .k-lbl {
        font-size: 9px;
        font-family: "Geist Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted-2);
        display: block;
        margin-bottom: 4px;
      }

      .showcase-kpi .k-val {
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      .showcase-kpi .k-val.red { color: var(--red); }
      .showcase-kpi .k-val.green { color: #168030; }

      .showcase-chart-box {
        padding: 12px 14px 10px;
        border-radius: 14px;
        background: linear-gradient(180deg, #f8f9fc 0%, #ffffff 100%);
        border: 1px solid var(--border);
      }

      .showcase-sim-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        font-size: 11.5px;
      }

      .showcase-sim-bar strong {
        color: var(--accent);
        font-weight: 700;
      }

      .showcase-sim-pill {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        white-space: nowrap;
      }

      /* ── Slide fechamento ── */
      .slide-closing {
        overflow: hidden;
      }

      .slide-closing::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 55% 48% at 78% 42%, rgba(0, 100, 253, 0.11), transparent 68%),
          radial-gradient(ellipse 42% 38% at 18% 72%, rgba(47, 199, 80, 0.08), transparent 62%);
        z-index: 0;
      }

      .slide-closing > * {
        position: relative;
        z-index: 1;
      }

      .closing-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(48px, 6vw, 96px);
        align-items: center;
      }

      .closing-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .closing-copy .display {
        font-size: clamp(56px, 7vw, 100px);
        max-width: none;
      }

      .closing-copy .lead {
        margin-top: 16px;
        max-width: 36ch;
      }

      .closing-qr-zone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        min-height: 380px;
      }

      .closing-qr-zone .orbit {
        opacity: 0.55;
        inset: -12px;
        pointer-events: none;
      }

      .closing-qr-zone .orbit svg {
        max-width: 380px;
      }

      .closing-qr-glow {
        position: absolute;
        top: 42%;
        left: 50%;
        width: clamp(260px, 22vw, 340px);
        height: clamp(260px, 22vw, 340px);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 100, 253, 0.14) 0%,
          rgba(47, 199, 80, 0.07) 42%,
          transparent 72%
        );
        pointer-events: none;
      }

      .closing-qr-zone img {
        position: relative;
        z-index: 1;
        display: block;
        width: clamp(190px, 17vw, 236px);
        height: clamp(190px, 17vw, 236px);
        border-radius: 16px;
        padding: 10px;
        background: #fff;
        border: 1px solid var(--border);
        box-shadow: 0 12px 32px -12px rgba(21, 26, 40, 0.14);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .closing-link {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        border: 1px solid var(--accent-border);
        background: var(--accent-soft);
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: clamp(14px, 1.2vw, 17px);
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        letter-spacing: -0.02em;
        transition: background 0.15s, color 0.15s;
      }

      .closing-link:hover {
        background: var(--accent);
        color: #fff;
      }

      .closing-link .arrow {
        font-size: 15px;
        opacity: 0.85;
      }

      .orbit {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .orbit svg { width: 100%; max-width: 440px; height: auto; }

      .orbit-tag {
        position: absolute;
        font-size: 12px;
        color: var(--text);
      }

      .orbit-tag .k { font-weight: 600; }
      .orbit-tag .s {
        display: block;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted-2);
        margin-top: 2px;
      }

      /* ── KPI ── */
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }

      .kpi {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 15px 17px;
        background: var(--surface);
        box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(21, 26, 40, 0.04), 0 6px 20px -4px rgba(21, 26, 40, 0.07);
      }

      .kpi .label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted-2);
        margin-bottom: 7px;
        font-weight: 600;
      }

      .kpi .big {
        font-size: clamp(20px, 2vw, 28px);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .kpi .sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
      .kpi.accent .big { color: var(--accent); }
      .kpi.green .big { color: var(--green); }
      .kpi.red .big { color: var(--red); }

      /* ── Cards ── */
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

      .card {
        position: relative;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 17px;
        box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(21, 26, 40, 0.03);
      }

      .card h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 7px;
        letter-spacing: -0.005em;
        padding-right: 64px;
      }

      .card p, .card li {
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0;
      }

      .card p strong, .card li strong {
        color: var(--text);
        font-weight: 600;
      }

      .card ul { margin: 0; padding-left: 16px; }
      .card ul li { margin: 5px 0; }

      .card .tag {
        position: absolute;
        top: 14px;
        right: 14px;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--accent-border);
        background: var(--accent-soft);
        font-weight: 700;
      }

      .transforms {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .transform-card {
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
      }

      .transform-card .change {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        line-height: 1.45;
        flex-wrap: wrap;
      }

      .transform-card .from {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: rgba(224, 69, 69, 0.45);
      }

      .transform-card .to { color: var(--text); font-weight: 600; }
      .transform-card .arrow { color: var(--accent); font-weight: 700; }

      /* ── Slide análise (03) ── */
      .analise-body {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        gap: clamp(28px, 3.5vw, 48px);
        align-items: center;
      }

      .analise-copy .title {
        max-width: 22ch;
        font-size: clamp(26px, 3.2vw, 44px);
        line-height: 1.08;
      }

      .analise-lead {
        margin-top: 14px;
        font-size: clamp(14px, 1.15vw, 16px);
        line-height: 1.6;
        color: var(--muted);
        max-width: 48ch;
      }

      .analise-metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
      }

      .analise-metric {
        padding: 14px 15px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.8);
      }

      .analise-metric .lbl {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted-2);
        margin-bottom: 6px;
      }

      .analise-metric .val {
        font-size: clamp(19px, 1.9vw, 25px);
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      .analise-metric .val.accent { color: var(--accent); }
      .analise-metric .val.red { color: var(--red); }
      .analise-metric .val.green { color: #168030; }

      .analise-metric .sub {
        margin-top: 5px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.35;
      }

      .analise-insights {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .analise-insight {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
        padding-left: 2px;
        margin: 0;
      }

      .analise-insight .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: 7px;
        flex-shrink: 0;
        opacity: 0.75;
      }

      .analise-insight strong {
        color: var(--text);
        font-weight: 600;
      }

      .chart-panel {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        padding: 22px 24px;
        box-shadow: inset 0 1px 0 #fff, 0 8px 32px -12px rgba(21, 26, 40, 0.12);
      }

      .chart-head {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted-2);
        font-weight: 700;
        margin-bottom: 14px;
      }

      .chart-panel svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .chart-note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
      }

      .analise-chart-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      .analise-chart-foot span {
        font-size: 11px;
        color: var(--muted);
      }

      .analise-chart-foot strong {
        color: var(--text);
        font-weight: 600;
      }

      /* ── Fontes / Implantação (12) ── */
      .body.sources-layout {
        justify-content: flex-start;
        gap: 16px;
        padding-top: 2px;
      }

      .sources-grid-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .sources-grid-cards .card {
        padding: 16px 18px;
        min-height: 138px;
      }

      .sources-grid-cards .card h3 {
        font-size: 15px;
        margin: 0 0 8px;
        padding-right: 68px;
      }

      .sources-grid-cards .card ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sources-grid-cards .card li {
        font-size: 12.5px;
        line-height: 1.48;
        color: var(--muted);
        padding: 4px 0;
        border-bottom: 1px solid rgba(21, 26, 40, 0.06);
      }

      .sources-grid-cards .card li:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      /* ── Glossário / Cenários (14) ── */
      .body.glossary-layout {
        justify-content: flex-start;
        gap: 14px;
        padding-top: 0;
      }

      .glossary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .glossary-grid .card {
        min-height: 0;
        padding: 14px 16px 13px;
      }

      .glossary-grid .card h3 {
        font-size: 14px;
        margin-bottom: 5px;
        padding-right: 56px;
      }

      .glossary-grid .card p {
        font-size: 12px;
        line-height: 1.42;
      }

      /* ── Architecture (13) ── */
      .arch-system { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }

      .arch-rail {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 16px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .arch-rail .rail-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted-2);
        font-weight: 700;
        margin-right: 8px;
      }

      .arch-rail .rail-chip {
        padding: 5px 10px;
        border-radius: 6px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-size: 11px;
        font-weight: 500;
      }

      .arch-cols {
        display: flex;
        align-items: stretch;
        gap: 0;
        flex: 1;
        min-height: 0;
      }

      .arch-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 15px 16px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        gap: 6px;
      }

      .arch-col.hub {
        flex: 1.25;
        background:
          radial-gradient(ellipse at top, rgba(0, 100, 253, 0.08), transparent 70%),
          linear-gradient(180deg, rgba(0, 100, 253, 0.04), var(--surface));
        border: 1.5px solid var(--accent-border);
        box-shadow: 0 8px 40px -8px rgba(0, 100, 253, 0.15);
      }

      .arch-col .col-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 5px;
      }

      .arch-col.hub .col-head { border-bottom-color: var(--accent-border); }

      .arch-col .col-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .arch-col .col-badge {
        margin-left: auto;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.16em;
        padding: 3px 7px;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
      }

      .arch-col .col-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 12.5px;
        padding: 4px 2px;
        font-weight: 500;
        line-height: 1.4;
      }

      .arch-col .col-item .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        flex-shrink: 0;
        margin-top: 6px;
      }

      .arch-col .col-item .dot.ai { background: var(--accent); }

      .arch-col .hub-tagline {
        margin-top: auto;
        padding: 8px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        border-radius: 8px;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        text-align: center;
      }

      .arch-arrow {
        flex: 0 0 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-2);
        font-size: 18px;
      }

      /* ── WF compare (10) ── */
      .wf-compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        flex: 1;
        min-height: 0;
        position: relative;
      }

      .wf-compare::before {
        content: "→";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
        background: var(--bg);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--accent-border);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      .wf-col {
        border-radius: 14px;
        padding: 18px 22px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 11px;
        background: var(--surface);
      }

      .wf-col.before { background: var(--red-soft); border-color: rgba(224, 69, 69, 0.2); }
      .wf-col.after { background: var(--green-soft); border-color: rgba(47, 199, 80, 0.22); }

      .wf-col-head .marker {
        align-self: flex-start;
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 6px;
        margin-bottom: 6px;
        display: inline-block;
      }

      .wf-col.before .wf-col-head .marker { background: rgba(224, 69, 69, 0.12); color: var(--red); }
      .wf-col.after .wf-col-head .marker { background: rgba(47, 199, 80, 0.14); color: #168030; }

      .wf-col-head h3 { font-size: 17px; margin: 0; font-weight: 600; line-height: 1.2; }
      .wf-col.before .wf-col-head h3 { color: var(--red); }
      .wf-col.after .wf-col-head h3 { color: #168030; }

      .wf-step {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
        line-height: 1.45;
      }

      .wf-step .wf-num {
        width: 21px;
        height: 21px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        font-weight: 700;
      }

      .wf-col.before .wf-step .wf-num { background: rgba(224, 69, 69, 0.12); color: var(--red); }
      .wf-col.after .wf-step .wf-num { background: rgba(47, 199, 80, 0.14); color: #168030; }

      .pills { display: flex; gap: 8px; flex-wrap: wrap; }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--text);
      }

      .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
      .pill.green .dot { background: var(--green); }

      /* ── Progress ── */
      #progressOverlay {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(21, 26, 40, 0.06);
        z-index: 50;
      }

      #progressFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--green));
        transition: width 320ms ease;
      }

      #hint {
        position: fixed;
        bottom: 14px;
        right: 18px;
        font-size: 10px;
        color: var(--muted-2);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-family: "Geist Mono", monospace;
        z-index: 40;
        pointer-events: none;
      }

      .qa-answer {
        font-size: clamp(15px, 1.25vw, 18px);
        line-height: 1.56;
        color: var(--muted);
        margin: 0;
        max-width: 78ch;
      }

      .qa-answer strong { color: var(--text); font-weight: 600; }

      .ia-cards .card {
        padding: 20px 22px;
      }

      .ia-cards .card h3 {
        font-size: clamp(16px, 1.4vw, 20px);
        margin-bottom: 8px;
      }

      .ia-cards .card p {
        font-size: clamp(13.5px, 1.1vw, 15.5px);
        line-height: 1.58;
        color: var(--muted);
      }

      .tool-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tool-pill {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 13px;
        font-weight: 600;
      }

      .tool-pill.accent {
        border-color: var(--accent-border);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .prompt-box {
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        padding: 16px 20px;
      }

      .prompt-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--accent);
        font-weight: 700;
        margin: 0 0 8px;
      }

      .prompt-text {
        font-family: "Geist Mono", monospace;
        font-size: clamp(12.5px, 1.02vw, 14.5px);
        line-height: 1.58;
        color: var(--text);
        margin: 0;
      }

      .prompt-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 8px;
      }

      /* ── Slide Jornada (05) ── */
      .ana-story {
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: center;
        min-height: 0;
      }

      .ana-hero {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 28px;
        align-items: center;
        padding: 20px 24px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background:
          radial-gradient(ellipse at 0% 0%, rgba(0, 100, 253, 0.06), transparent 55%),
          var(--surface);
        box-shadow: inset 0 1px 0 #fff, 0 8px 28px -12px rgba(21, 26, 40, 0.1);
      }

      .ana-persona {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .ana-avatar {
        flex-shrink: 0;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
      }

      .ana-name {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .ana-meta {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.45;
      }

      .ana-score-flow {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }

      .score-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 96px;
      }

      .score-block .val {
        font-size: clamp(28px, 3.4vw, 42px);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .score-block.low .val { color: var(--red); }
      .score-block.high .val { color: #168030; }

      .score-block .lbl {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted-2);
        font-weight: 600;
        text-align: center;
      }

      .flow-connector {
        position: relative;
        width: 76px;
        height: 2px;
        background: linear-gradient(90deg, var(--red), var(--accent), var(--green));
        border-radius: 999px;
      }

      .flow-connector span {
        position: absolute;
        left: 50%;
        top: -20px;
        transform: translateX(-50%);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      .ana-journey {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .journey-card {
        border-radius: 16px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 164px;
      }

      .journey-card .phase {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .journey-card.problem { border-top: 3px solid var(--red); }
      .journey-card.problem .phase { color: var(--red); }
      .journey-card.action { border-top: 3px solid var(--accent); background: var(--accent-soft); }
      .journey-card.action .phase { color: var(--accent); }
      .journey-card.result { border-top: 3px solid var(--green); }
      .journey-card.result .phase { color: #168030; }

      .journey-card h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .journey-card ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .journey-card li {
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--text);
        padding-left: 14px;
        position: relative;
      }

      .journey-card li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.55em;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.45;
      }

      /* ── Slide plataforma (06) ── */
      .platform-body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        min-height: 0;
      }

      .platform-modules {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .platform-modules .card {
        min-height: 118px;
        display: flex;
        flex-direction: column;
      }

      .platform-modules .card p { flex: 1; }

      .platform-modules .route {
        display: block;
        margin-top: 10px;
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        color: var(--muted-2);
      }

      .platform-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .platform-url {
        font-family: "Geist Mono", monospace;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
      }

      .platform-url:hover { text-decoration: underline; }

      @media (max-width: 1100px) {
        .cover, .closing-layout, .wf-compare, .grid-2, .grid-3, .transforms, .analise-body, .prompt-grid, .ana-hero, .ana-journey, .platform-modules, .sources-grid-cards {
          grid-template-columns: 1fr;
        }
        .glossary-grid { grid-template-columns: 1fr 1fr; }
        .arch-cols { flex-direction: column; }
        .arch-arrow { transform: rotate(90deg); height: 24px; }
      }

      @media print {
        @page { size: 1920px 1080px; margin: 0; }
        .slide {
          position: relative;
          opacity: 1;
          transform: none;
          page-break-after: always;
          height: 1080px;
        }
        #progressOverlay, #hint { display: none; }
      }
    </style>
  </head>

          <h2 class="title"><span class="hl">Três escolhas</span> e quatro estados transparentes.</h2>
          <p class="lead">
            Em vez de prometer prever toda a vida financeira com modelos opacos, o MVP foca em regras determinísticas,
            separando compromissos confirmados de estimativas e oferecendo simulação imediata.
          </p>

          <div class="grid-3">
            <div class="card">
              <span class="tag">Escolha 01</span>
              <h3>Datas importam</h3>
              <p>Organiza entradas e saídas em ordem cronológica. Mesmo que o salário cubra tudo no fim do mês, alerta se uma conta vence antes.</p>
            </div>
            <div class="card">
              <span class="tag">Escolha 02</span>
              <h3>Certeza importa</h3>
              <p>Contas confirmadas (boletos DDA, débito automático, parcelas fixas) têm peso diferente de gastos estimados ou entradas incertas.</p>
            </div>
            <div class="card">
              <span class="tag">Escolha 03</span>
              <h3>Ação importa</h3>
              <p>Todo alerta permite agir: marcar conta como paga por outro banco, ajustar valor estimado ou simular nova data com aviso de encargos.</p>
            </div>
            <div class="card">
              <span class="tag">Estado 01</span>
              <h3>Alerta Preventivo</h3>
              <p>Disparado somente quando <strong>compromissos confirmados</strong> indicam saldo negativo antes do próximo recebimento.</p>
            </div>
            <div class="card">
              <span class="tag">Estado 02</span>
              <h3>Aviso Condicional</h3>
              <p>Quando as contas confirmadas cabem no saldo, mas <strong>gastos estimados</strong> ou o horário no mesmo dia trazem risco.</p>
            </div>
            <div class="card" style="border-color: var(--green); background: var(--green-soft);">
              <span class="tag">Estados 03 e 04</span>
              <h3>Estável &amp; Sem Conclusão</h3>
              <p><strong>Sem insuficiência identificada</strong> (sem prometer que não haverá gastos extras) ou <strong>Dados insuficientes</strong> quando falta histórico.</p>
            </div>

          <h2 class="title">Responsabilidade ao lidar com o <span class="hl">dinheiro das pessoas</span>.</h2>
          <p class="qa-answer">
            Em produto financeiro, um erro de cálculo ou uma frase mal escrita pode assustar o cliente ou induzi-lo a atrasar uma conta importante.
          </p>

          <div class="grid-2 ia-cards">
            <div class="card">
              <span class="tag">Proteção ao Cliente</span>
              <h3>Quatro riscos mitigados no design</h3>
              <p>
                • <strong>Falso positivo:</strong> conta paga em outro banco pode ser marcada em 1 toque.<br/>
                • <strong>Falso negativo:</strong> nunca dizemos &ldquo;Você não ficará negativo&rdquo;, mas sim <em>&ldquo;Com base nos compromissos identificados, não encontramos falta prevista&rdquo;</em>.<br/>
                • <strong>Simulação × Realidade:</strong> aviso explícito de que simular não cancela nem agenda boletos.<br/>
                • <strong>Encargos:</strong> alerta automático ao simular pagamento após o vencimento.
              </p>
            </div>
            <div class="card" style="border-color: var(--accent-border); background: var(--accent-soft);">
              <span class="tag">Ética &amp; Autoria</span>
              <h3>Dados fictícios e domínio integral</h3>
              <p>
                • <strong>Zero dados reais:</strong> todos os 7 cenários utilizam personas e transações 100% sintéticas.<br/>
                • <strong>Revisão linha a linha:</strong> nenhum trecho gerado por IA entrou no projeto sem que eu compreendesse a regra matemática e soubesse explicar cada decisão.<br/>
                • <strong>Transparência sobre não saber:</strong> quando faltam dados (Cenário 07), o motor declara <em>Sem Conclusão</em> em vez de chutar.
              </p>
            </div>
          </div>
        </div>

                <circle cx="230" cy="230" r="150" stroke="rgba(0,100,253,0.18)" />
                <circle cx="230" cy="230" r="90" stroke="rgba(47,199,80,0.24)" />
                <circle cx="230" cy="230" r="52" fill="#ffffff" stroke="rgba(0,100,253,0.28)" stroke-width="2"/>
                <text x="230" y="235" text-anchor="middle" font-family="Geist,sans-serif" font-size="13" font-weight="700" fill="#0064fd">Fôlego</text>

              <span class="arrow" aria-hidden="true">→</span>

    </template>

    <div id="progressOverlay"><div id="progressFill"></div></div>
    <div id="hint">← → navegar · F tela cheia</div>

    <script>
      const stage = document.getElementById("stage");
      const template = document.getElementById("slides");
      const progressFill = document.getElementById("progressFill");

      const fragment = template.content.cloneNode(true);
      const slideEls = Array.from(fragment.querySelectorAll(".slide"));
      stage.appendChild(fragment);

      let idx = 0;

      function update() {
        slideEls.forEach((el, i) => el.classList.toggle("active", i === idx));
        progressFill.style.width = `${((idx + 1) / slideEls.length) * 100}%`;
        history.replaceState(null, "", `#${idx + 1}`);
      }

      function goto(n) {
        idx = Math.max(0, Math.min(slideEls.length - 1, n));
        update();
      }

      function next() { goto(idx + 1); }
      function prev() { goto(idx - 1); }

      function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
        else document.exitFullscreen?.().catch(() => {});
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
        else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
        else if (e.key.toLowerCase() === "f") toggleFullscreen();
        else if (e.key.toLowerCase() === "p") window.print();
        else if (e.key === "Home") goto(0);
        else if (e.key === "End") goto(slideEls.length - 1);
      });

      let tx = 0;
      window.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
      window.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
      }, { passive: true });

      const hash = Number.parseInt(window.location.hash.replace("#", ""), 10);
      goto(Number.isFinite(hash) && hash >= 1 ? hash - 1 : 0);
    </script>
  </body>
